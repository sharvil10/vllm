# Kubernetes-native port of .buildkite/intel_jobs/lora_intel.yaml.
#
# Same tests and timeouts as upstream; only the runner changes. Instead of
# run-intel-test.sh doing `docker run --privileged` on a bare-metal agent,
# each step is a Pod on the vllm-ci cluster:
#   - image: upstream's image-build-xpu output (${VLLM_XPU_IMAGE}, resolved by
#     upload.sh); nothing is built here
#   - GPUs: DRA ResourceClaimTemplate b70-<N> (upstream `gpu: N+` agent tag),
#     so the Pod only sees its own GPUs and ZE_AFFINITY_MASK is unnecessary
#   - admission: Kueue LocalQueue vllm-ci/ci-b70
#
# agent-stack-k8s mounts an emptyDir at /workspace in every container, which
# hides the image's /workspace/vllm (the source tree tests run from, and the
# editable install of tests/vllm_test_utils). The copy-vllm-src init
# container copies it out of the image into that emptyDir first, so the
# tests see the same tree as upstream. No git checkout is needed, but the
# bootstrap still cd's to the (empty) checkout dir, so commands cd to
# /workspace/vllm explicitly. They run under the image's /bin/sh (dash) with
# -e; BUILDKITE_SHELL is a protected var, so wrap bashisms in `bash -c`.
#
# Deviation: upstream's `set -o pipefail` (Punica Kernels) is dropped; dash
# rejects it and those commands have no pipes.
#
# Env mirrors what run-intel-test.sh sets for the container.

.env: &env
  VLLM_TEST_DEVICE: "xpu"
  PYTHONPATH: ".."
  # Remove once intel/intel-xpu-backend-for-triton#7682 is fixed (upstream).
  VLLM_DISABLE_COMPILE_CACHE: "1"

.k8s-1gpu: &k8s-1gpu
  checkout:
    skip: true
  metadata: &k8s-metadata
    labels:
      kueue.x-k8s.io/queue-name: ci-b70
      kueue.x-k8s.io/priority-class: priority-normal
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-1
    # Only used when upload.sh points VLLM_XPU_IMAGE at the private ghcr mirror.
    imagePullSecrets: &pull-secrets
      - name: ghcr-push
    initContainers: &init-containers
      - name: copy-vllm-src
        image: ${VLLM_XPU_IMAGE}
        command: ["cp", "-a", "/workspace/vllm", "/mnt/workspace/"]
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
    containers: &containers
      - image: ${VLLM_XPU_IMAGE}
        workingDir: /workspace/vllm
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          claims:
            - name: gpu
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "32"
            memory: "64Gi"
        volumeMounts:
          # Upstream runs with --ipc=host; the Pod default /dev/shm is 64 MiB.
          - name: dshm
            mountPath: /dev/shm
          # Upstream mounts /data/huggingface here; node-local cache on the worker.
          - name: hf-cache
            mountPath: /root/.cache/huggingface
    volumes: &volumes
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: hf-cache
        hostPath:
          path: /var/lib/hf-cache
          type: DirectoryOrCreate

# Upstream `gpu: 2+`: same Pod, two B70s.
.k8s-2gpu: &k8s-2gpu
  checkout:
    skip: true
  metadata: *k8s-metadata
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-2
    imagePullSecrets: *pull-secrets
    initContainers: *init-containers
    containers: *containers
    volumes: *volumes

steps:
  - group: LoRA Intel
    key: lora-intel
    steps:
    - label: "LoRA Runtime + Utils"
      key: lora-runtime-utils
      timeout_in_minutes: 45
      agents:
        queue: intel-b70
      env: *env
      commands:
        - cd /workspace/vllm/tests
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s lora/test_layers.py
        - pytest -v -s lora/test_lora_checkpoints.py
        - pytest -v -s lora/test_lora_functions.py
        - pytest -v -s lora/test_lora_huggingface.py
        - pytest -v -s lora/test_lora_manager.py
        - pytest -v -s lora/test_lora_utils.py
        - pytest -v -s lora/test_peft_helper.py
        - pytest -v -s lora/test_resolver.py
        - pytest -v -s lora/test_utils.py
        - pytest -v -s lora/test_worker.py
      plugins:
        - kubernetes: *k8s-1gpu

    - label: "LoRA Fused/MoE Kernels"
      key: lora-fused-moe-kernels
      timeout_in_minutes: 45
      agents:
        queue: intel-b70
      env: *env
      commands:
        - cd /workspace/vllm/tests
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s lora/test_fused_moe_lora_kernel.py
        - pytest -v -s lora/test_moe_lora_align_sum.py --deselect="tests/lora/test_moe_lora_align_sum.py::test_moe_lora_align_block_size_mixed_base_and_lora[1]"
      plugins:
        - kubernetes: *k8s-1gpu

    - label: "LoRA Punica Kernels"
      key: lora-punica-kernels
      timeout_in_minutes: 45
      agents:
        queue: intel-b70
      env: *env
      commands:
        - cd /workspace/vllm/tests
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s lora/test_punica_ops.py::test_kernels
        - pytest -v -s lora/test_punica_ops.py::test_kernels_hidden_size
        - pytest -v -s lora/test_punica_ops.py::test_add_lora_fused_moe_early_exit
      plugins:
        - kubernetes: *k8s-1gpu

    - label: "LoRA Punica FP8/XPU Ops"
      key: lora-punica-fp8-xpu-ops
      timeout_in_minutes: 60
      agents:
        queue: intel-b70
      env: *env
      commands:
        - cd /workspace/vllm/tests
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s lora/test_punica_ops_fp8.py
        - pytest -v -s lora/test_punica_xpu_ops.py
      plugins:
        - kubernetes: *k8s-1gpu

    - label: "LoRA Models"
      key: lora-models
      timeout_in_minutes: 45
      agents:
        queue: intel-b70
      env: *env
      commands:
        - cd /workspace/vllm/tests
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s lora/test_quant_model.py --deselect="tests/lora/test_quant_model.py::test_quant_model_lora[model0]" --deselect="tests/lora/test_quant_model.py::test_quant_model_lora[model1]" --deselect="tests/lora/test_quant_model.py::test_quant_model_tp_equality[model0]"
        - pytest -v -s lora/test_transformers_model.py
        - pytest -v -s lora/test_chatglm3_tp.py
        - pytest -v -s lora/test_llama_tp.py::test_llama_lora
      plugins:
        - kubernetes: *k8s-2gpu

    - label: "LoRA Multimodal"
      key: lora-multimodal
      timeout_in_minutes: 45
      agents:
        queue: intel-b70
      env: *env
      commands:
        - cd /workspace/vllm/tests
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s lora/test_whisper.py
      plugins:
        - kubernetes: *k8s-1gpu

    - label: "LoRA Add + Multimodal"
      key: lora-add-multimodal
      timeout_in_minutes: 45
      agents:
        queue: intel-b70
      env: *env
      commands:
        - cd /workspace/vllm/tests
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s lora/test_add_lora.py
        - pytest -v -s lora/test_default_mm_loras.py
        - pytest -s -v lora/test_minicpmv_tp.py
      plugins:
        - kubernetes: *k8s-2gpu

# Kubernetes-native port of .buildkite/intel_jobs/distributed_intel.yaml.
#
# Same tests and timeouts as upstream; runner differences (image, DRA GPUs,
# Kueue, copy-vllm-src init container, explicit cd) are described in
# kernels_intel.yaml and README.md.

.env: &env
  VLLM_TEST_DEVICE: "xpu"
  PYTHONPATH: ".."
  # Remove once intel/intel-xpu-backend-for-triton#7682 is fixed (upstream).
  VLLM_DISABLE_COMPILE_CACHE: "1"

.k8s-2gpu: &k8s-2gpu
  checkout:
    skip: true
  metadata:
    labels:
      kueue.x-k8s.io/queue-name: ci-b70
      kueue.x-k8s.io/priority-class: priority-normal
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-2
    # Only used when upload.sh points VLLM_XPU_IMAGE at the private ghcr mirror.
    imagePullSecrets:
      - name: ghcr-push
    initContainers:
      - name: copy-vllm-src
        image: ${VLLM_XPU_IMAGE}
        command: ["cp", "-a", "/workspace/vllm", "/mnt/workspace/"]
        volumeMounts:
          - name: workspace
            mountPath: /mnt/workspace
    containers:
      - image: ${VLLM_XPU_IMAGE}
        workingDir: /workspace/vllm
        env:
          # Gated HF models (meta-llama/*); upstream passes HF_TOKEN too.
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          claims:
            - name: gpu
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "32"
            memory: "64Gi"
        volumeMounts:
          # Upstream runs with --ipc=host; the Pod default /dev/shm is 64 MiB.
          - name: dshm
            mountPath: /dev/shm
          # Upstream mounts /data/huggingface here; node-local cache on the worker.
          - name: hf-cache
            mountPath: /root/.cache/huggingface
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: hf-cache
        hostPath:
          path: /var/lib/hf-cache
          type: DirectoryOrCreate

steps:
  - group: Distributed Intel
    key: distributed-intel
    steps:
    - label: ":intel: (BMG) Distributed Torchrun + Shutdown"
      key: distributed-torchrun-shutdown-tests-2-gpus
      timeout_in_minutes: 50
      agents:
        queue: intel-b70
      env: *env
      source_file_dependencies:
        - vllm/distributed/
        - "!vllm/distributed/kv_transfer/"
        - vllm/engine/
        - vllm/executor/
        - vllm/worker/worker_base.py
        - vllm/v1/engine/
        - vllm/v1/worker/
        - tests/distributed/
        - tests/v1/shutdown
        - tests/v1/worker/test_worker_memory_snapshot.py
      commands:
        - cd /workspace/vllm/tests
        - pytest -v -s v1/shutdown
      plugins:
        - kubernetes: *k8s-2gpu

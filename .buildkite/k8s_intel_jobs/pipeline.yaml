---
# vLLM Intel XPU CI, Kubernetes-native rewrite.
#
# Target: Buildkite agent-stack-k8s controller watching queue=intel-b70.
# Each step becomes a Pod in the controller's namespace (vllm-ci).
# Non-upstream: lives on the fork branch k8s-ci-bringup.
#
# PR builds run tests ONLY — against a prebuilt image. Rebuild workflow
# is in .buildkite/k8s_intel_jobs/build.yaml and is invoked separately.
# Update IMAGE below after each intentional rebuild.
steps:
  - label: ":test_tube: XPU smoke: opt-125m generate.py"
    key: xpu-smoke
    agents:
      queue: intel-b70
    # Pinned image: last known-good XPU build (build 9, 2026-10-02).
    # Bump the container image below after each intentional rebuild via build.yaml.
    commands:
      - |
        set -eu
        # Image's /bin/sh is dash; no bash features (pipefail, source).
        # Call the venv python directly instead of activating.
        # Run via absolute script path so sys.path[0] = examples/.../ and
        # the installed vllm takes precedence over the checkout's local
        # source tree.
        /opt/venv/bin/python3 "$BUILDKITE_BUILD_CHECKOUT_PATH/examples/basic/offline_inference/generate.py" \
          --model facebook/opt-125m --block-size 64 --enforce-eager
    plugins:
      - kubernetes:
          # Kueue holds the Job until ci-cq has quota, then admits it.
          metadata:
            labels:
              kueue.x-k8s.io/queue-name: ci-b70
              kueue.x-k8s.io/priority-class: priority-normal
          podSpec:
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: b70-1
            containers:
              - image: ghcr.io/sharvil10/vllm-xpu:12a974de181da1f39e54dca0d174e07f4f4d75a8-xpu
                resources:
                  claims:
                    - name: gpu
                  requests:
                    cpu: "2"
                    memory: "8Gi"
                  limits:
                    cpu: "8"
                    memory: "16Gi"

  # Scale test: only runs when a build is created with SCALE_TEST=true.
  # Fans out N identical GPU jobs so controller scale-out and Kueue
  # admission/borrowing can be observed. Holds the GPU ~2 min so the
  # overlap is visible.
  - label: ":chart_with_upwards_trend: scale test {{matrix}}"
    key: scale-test
    if: build.env("SCALE_TEST") == "true"
    agents:
      queue: intel-b70
    matrix:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
    commands:
      - |
        set -eu
        echo "shard {{matrix}} on $(hostname)"
        /opt/venv/bin/python3 -c 'import torch; print("xpu devices:", torch.xpu.device_count())'
        sleep 120
    plugins:
      - kubernetes:
          metadata:
            labels:
              kueue.x-k8s.io/queue-name: ci-b70
              kueue.x-k8s.io/priority-class: priority-low
          podSpec:
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: b70-1
            containers:
              - image: ghcr.io/sharvil10/vllm-xpu:12a974de181da1f39e54dca0d174e07f4f4d75a8-xpu
                resources:
                  claims:
                    - name: gpu
                  requests:
                    cpu: "2"
                    memory: "4Gi"
                  limits:
                    cpu: "4"
                    memory: "8Gi"

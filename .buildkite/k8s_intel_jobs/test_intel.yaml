# Kubernetes-native port of .buildkite/intel_jobs/test-intel.yaml.
#
# Same tests, timeouts, retry and parallelism as upstream; see README.md for
# the conversion rules and kernels_intel.yaml for the annotated template.
# Commands start with `cd /workspace/vllm` (where run-intel-test.sh's
# container starts) and are upstream's &&-chain, one item per command.
# parallelism steps re-create run-intel-test.sh's pytest-shard PYTEST_ADDOPTS.

.env: &env
  VLLM_TEST_DEVICE: "xpu"
  PYTHONPATH: ".."
  # Remove once intel/intel-xpu-backend-for-triton#7682 is fixed (upstream).
  VLLM_DISABLE_COMPILE_CACHE: "1"

# Restores the image's /workspace/vllm, hidden by agent-stack-k8s's
# /workspace emptyDir (see kernels_intel.yaml).
.init: &init
  - name: copy-vllm-src
    image: ${VLLM_XPU_IMAGE}
    command: ["cp", "-a", "/workspace/vllm", "/mnt/workspace/"]
    volumeMounts:
      - name: workspace
        mountPath: /mnt/workspace

.mounts: &mounts
  # Upstream runs with --ipc=host; the Pod default /dev/shm is 64 MiB.
  - name: dshm
    mountPath: /dev/shm
  # Upstream mounts /data/huggingface here; node-local cache on the worker.
  - name: hf-cache
    mountPath: /root/.cache/huggingface

.volumes: &volumes
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
  - name: hf-cache
    hostPath:
      path: /var/lib/hf-cache
      type: DirectoryOrCreate

.k8s-1gpu: &k8s-1gpu
  checkout:
    skip: true
  metadata:
    labels:
      kueue.x-k8s.io/queue-name: ci-b70
      kueue.x-k8s.io/priority-class: priority-normal
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-1
    # Only used when upload.sh points VLLM_XPU_IMAGE at the private ghcr mirror.
    imagePullSecrets:
      - name: ghcr-push
    initContainers: *init
    containers:
      - image: ${VLLM_XPU_IMAGE}
        workingDir: /workspace/vllm
        resources:
          claims:
            - name: gpu
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "32"
            memory: "64Gi"
        volumeMounts: *mounts
    volumes: *volumes

.k8s-2gpu: &k8s-2gpu
  checkout:
    skip: true
  metadata:
    labels:
      kueue.x-k8s.io/queue-name: ci-b70
      kueue.x-k8s.io/priority-class: priority-normal
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-2
    # Only used when upload.sh points VLLM_XPU_IMAGE at the private ghcr mirror.
    imagePullSecrets:
      - name: ghcr-push
    initContainers: *init
    containers:
      - image: ${VLLM_XPU_IMAGE}
        workingDir: /workspace/vllm
        resources:
          claims:
            - name: gpu
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "32"
            memory: "128Gi"
        volumeMounts: *mounts
    volumes: *volumes

steps:
  - group: Intel
    key: test-intel
    steps:
    - label: XPU example Test
      key: xpu-example-test
      timeout_in_minutes: 70
      agents:
        queue: intel-b70
      env: *env
      commands:
      - cd /workspace/vllm
      - python3 examples/basic/offline_inference/generate.py --model facebook/opt-125m --block-size 64 --enforce-eager
      - python3 examples/basic/offline_inference/generate.py --model facebook/opt-125m --block-size 64 -O3 -cc.cudagraph_mode=NONE
      - python3 examples/basic/offline_inference/generate.py --model facebook/opt-125m --block-size 64 --enforce-eager -tp 2 --distributed-executor-backend mp
      - python3 examples/basic/offline_inference/generate.py --model facebook/opt-125m --block-size 64 --enforce-eager --attention-backend=TRITON_ATTN
      - python3 examples/basic/offline_inference/generate.py --model facebook/opt-125m --block-size 64 --enforce-eager --quantization fp8_per_tensor
      - python3 examples/basic/offline_inference/generate.py --model facebook/opt-125m --block-size 64 --enforce-eager --kv-cache-dtype fp8
      - python3 examples/basic/offline_inference/generate.py --model nvidia/Llama-3.1-8B-Instruct-FP8 --block-size 64 --enforce-eager --quantization modelopt --kv-cache-dtype fp8 --attention-backend TRITON_ATTN --max-model-len 4096
      - python3 examples/basic/offline_inference/generate.py --model superjob/Qwen3-4B-Instruct-2507-GPTQ-Int4 --block-size 64 --enforce-eager --max-model-len 8192
      - python3 examples/basic/offline_inference/generate.py --model TheBloke/TinyLlama-1.1B-Chat-v0.3-AWQ --block-size 64 --enforce-eager
      - python3 examples/basic/offline_inference/generate.py --model ibm-research/PowerMoE-3b --block-size 64 --enforce-eager -tp 2
      - python3 examples/basic/offline_inference/generate.py --model ibm-research/PowerMoE-3b --block-size 64 --enforce-eager -tp 2 --enable-expert-parallel
      - python3 examples/basic/offline_inference/generate.py --model superjob/Qwen3-4B-Instruct-2507-GPTQ-Int4 --max-model-len 8192
      - python3 examples/basic/offline_inference/generate.py --model INCModel/Qwen3-30B-A3B-Instruct-2507-MXFP4-LLMC -tp 2 --max-model-len 8192
      plugins:
      - kubernetes: *k8s-2gpu
    - label: XPU W8A8 FP8 Linear Examples
      key: xpu-w8a8-fp8-linear-examples
      timeout_in_minutes: 60
      agents:
        queue: intel-b70
      env: *env
      commands:
      - cd /workspace/vllm
      - python3 examples/basic/offline_inference/generate.py --linear-backend xpu --model RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8 --enforce-eager --max-model-len 4096
      - python3 examples/basic/offline_inference/generate.py --linear-backend torch --model RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8 --enforce-eager --max-model-len 4096
      - python3 examples/basic/offline_inference/generate.py --linear-backend xpu --model neuralmagic/Llama-3.2-1B-Instruct-FP8-dynamic --enforce-eager --max-model-len 4096
      - python3 examples/basic/offline_inference/generate.py --linear-backend torch --model Qwen/Qwen3-4B-Instruct-2507-FP8 --enforce-eager --max-model-len 4096
      - python3 examples/basic/offline_inference/generate.py --linear-backend xpu --model meta-llama/Llama-3.2-1B-Instruct --quantization fp8_per_tensor --enforce-eager --max-model-len 4096
      - python3 examples/basic/offline_inference/generate.py --linear-backend torch --model meta-llama/Llama-3.2-1B-Instruct --quantization fp8_per_tensor --enforce-eager --max-model-len 4096
      plugins:
      - kubernetes: *k8s-1gpu
    - label: XPU V1 test
      key: xpu-v1-test
      timeout_in_minutes: 70
      agents:
        queue: intel-b70
      env: *env
      parallelism: 2
      commands:
      - cd /workspace/vllm
      - export PYTEST_ADDOPTS="--num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB"
      - cd tests
      - pip install dpctl
      - pytest -v -s v1/core --ignore=v1/core/test_reset_prefix_cache_e2e.py --ignore=v1/core/test_scheduler_e2e.py
      - pytest -v -s v1/engine --ignore=v1/engine/test_output_processor.py --ignore=v1/engine/test_core_engine_actor_manager.py
      - pytest -v -s v1/sample --ignore=v1/sample/test_logprobs.py --ignore=v1/sample/test_logprobs_e2e.py -k "not test_topk_only and not test_topp_only and not test_topk_and_topp"
      - pytest -v -s v1/worker --ignore=v1/worker/test_gpu_model_runner.py --ignore=v1/worker/test_worker_memory_snapshot.py
      - pytest -v -s v1/structured_output
      - pytest -v -s v1/test_serial_utils.py
      - pytest -v -s v1/e2e/general/test_correctness_sliding_window.py
      - pytest -v -s v1/spec_decode --ignore=v1/spec_decode/test_max_len.py --ignore=v1/spec_decode/test_speculators_eagle3.py --ignore=v1/spec_decode/test_acceptance_length.py --ignore=v1/spec_decode/test_speculators_correctness.py --deselect=tests/v1/spec_decode/test_mtp.py::test_glm_mtp_defers_lm_head
      - pytest -v -s v1/kv_connector/unit --ignore=v1/kv_connector/unit/test_lmcache_integration.py --ignore=v1/kv_connector/unit/test_hf3fs_client.py --ignore=v1/kv_connector/unit/test_hf3fs_connector.py --ignore=v1/kv_connector/unit/test_hf3fs_metadata_server.py --ignore=v1/kv_connector/unit/test_offloading_connector.py --ignore=v1/kv_connector/unit/test_multi_connector.py --ignore=v1/kv_connector/unit/test_example_connector.py --deselect=tests/v1/kv_connector/unit/test_nixl_connector.py::test_abort_timeout_on_prefiller[ray]
      plugins:
      - kubernetes: *k8s-1gpu
    - label: XPU Qwen3-30B + V1 KV Connector
      key: xpu-qwen3-30b-v1-kv-connector
      timeout_in_minutes: 90
      agents:
        queue: intel-b70
      env: *env
      commands:
      - cd /workspace/vllm
      - cd tests
      - pip install dpctl
      - pytest -v -s v1/kv_connector/unit/test_multi_connector.py
      - pytest -v -s v1/kv_connector/unit/test_example_connector.py
      - cd ..
      - VLLM_XPU_FUSED_MOE_USE_REF=1 python3 examples/basic/offline_inference/generate.py --model Qwen/Qwen3-30B-A3B-Instruct-2507-FP8 --enforce-eager -tp 2 --max-model-len 8192
      plugins:
      - kubernetes: *k8s-2gpu
    - label: XPU server test
      key: xpu-server-test
      timeout_in_minutes: 45
      agents:
        queue: intel-b70
      env: *env
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s entrypoints/multimodal/openai/chat_completion/test_audio_in_video.py
      - pytest -v -s benchmarks/test_serve_cli.py
      plugins:
      - kubernetes: *k8s-1gpu
    - label: XPU quantization test
      key: xpu-quantization-test
      timeout_in_minutes: 30
      agents:
        queue: intel-b70
      env: *env
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s quantization/test_auto_round.py
      - pytest -v -s quantization/test_online.py --deselect=tests/quantization/test_online.py::test_online_quantization_loads_real_weights --deselect="tests/quantization/test_online.py::test_online_quantization[False-requantization_mxfp8_ptcp_fp8]"
      plugins:
      - kubernetes: *k8s-1gpu
    - label: XPU compressed tensors FP8 test
      key: xpu-compressed-tensors-fp8-test
      timeout_in_minutes: 60
      agents:
        queue: intel-b70
      env: *env
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s quantization/test_compressed_tensors.py::test_compressed_tensors_fp8
      - pytest -v -s quantization/test_compressed_tensors.py::test_compressed_tensors_fp8_block_enabled
      plugins:
      - kubernetes: *k8s-1gpu
    - label: XPU Graph
      key: xpu-graph
      timeout_in_minutes: 60
      agents:
        queue: intel-b70
      env: *env
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s v1/cudagraph/test_cudagraph_dispatch.py
      - pytest -v -s v1/cudagraph/test_cudagraph_mode.py
      - pytest -v -s v1/cudagraph/test_breakable_cudagraph.py
      - pytest -v -s v1/cudagraph/test_encoder_cudagraph.py
      plugins:
      - kubernetes: *k8s-1gpu

# Kubernetes-native port of .buildkite/intel_jobs/misc_intel.yaml.
#
# Same tests, timeouts, retry and parallelism as upstream; see README.md for
# the conversion rules and kernels_intel.yaml for the annotated template.
# Commands start with `cd /workspace/vllm` (where run-intel-test.sh's
# container starts) and are upstream's &&-chain, one item per command.
# parallelism steps re-create run-intel-test.sh's pytest-shard PYTEST_ADDOPTS.

.env: &env
  VLLM_TEST_DEVICE: "xpu"
  PYTHONPATH: ".."
  # Remove once intel/intel-xpu-backend-for-triton#7682 is fixed (upstream).
  VLLM_DISABLE_COMPILE_CACHE: "1"

# Restores the image's /workspace/vllm, hidden by agent-stack-k8s's
# /workspace emptyDir (see kernels_intel.yaml).
.init: &init
  - name: copy-vllm-src
    image: ${VLLM_XPU_IMAGE}
    command: ["cp", "-a", "/workspace/vllm", "/mnt/workspace/"]
    volumeMounts:
      - name: workspace
        mountPath: /mnt/workspace

.mounts: &mounts
  # Upstream runs with --ipc=host; the Pod default /dev/shm is 64 MiB.
  - name: dshm
    mountPath: /dev/shm
  # Upstream mounts /data/huggingface here; node-local cache on the worker.
  - name: hf-cache
    mountPath: /root/.cache/huggingface

.volumes: &volumes
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
  - name: hf-cache
    hostPath:
      path: /var/lib/hf-cache
      type: DirectoryOrCreate

.k8s-1gpu: &k8s-1gpu
  checkout:
    skip: true
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-1
    # Only used when upload.sh points VLLM_XPU_IMAGE at the private ghcr mirror.
    imagePullSecrets:
      - name: ghcr-push
    initContainers: *init
    containers:
      - image: ${VLLM_XPU_IMAGE}
        workingDir: /workspace/vllm
        env:
          # Gated HF models (meta-llama/*); upstream passes HF_TOKEN too.
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          claims:
            - name: gpu
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "32"
            memory: "64Gi"
        volumeMounts: *mounts
    volumes: *volumes

.k8s-2gpu: &k8s-2gpu
  checkout:
    skip: true
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-2
    # Only used when upload.sh points VLLM_XPU_IMAGE at the private ghcr mirror.
    imagePullSecrets:
      - name: ghcr-push
    initContainers: *init
    containers:
      - image: ${VLLM_XPU_IMAGE}
        workingDir: /workspace/vllm
        env:
          # Gated HF models (meta-llama/*); upstream passes HF_TOKEN too.
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          claims:
            - name: gpu
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "32"
            memory: "128Gi"
        volumeMounts: *mounts
    volumes: *volumes

.k8s-4gpu: &k8s-4gpu
  checkout:
    skip: true
  podSpec:
    resourceClaims:
      - name: gpu
        resourceClaimTemplateName: b70-4
    # Only used when upload.sh points VLLM_XPU_IMAGE at the private ghcr mirror.
    imagePullSecrets:
      - name: ghcr-push
    initContainers: *init
    containers:
      - image: ${VLLM_XPU_IMAGE}
        workingDir: /workspace/vllm
        env:
          # Gated HF models (meta-llama/*); upstream passes HF_TOKEN too.
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          claims:
            - name: gpu
          requests:
            cpu: "16"
            memory: "64Gi"
          limits:
            cpu: "64"
            memory: "192Gi"
        volumeMounts: *mounts
    volumes: *volumes

steps:
  - group: Miscellaneous Intel
    key: misc-intel
    steps:
    - label: ":intel: (BMG) Batch Invariance"
      key: xpu-batch-invariance
      timeout_in_minutes: 60
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/
        - tests/v1/determinism/test_xpu_batch_invariant_ut.py
        - .buildkite/scripts/hardware_ci/run-xpu-batch-invariance.sh
        - .buildkite/intel_jobs/misc_intel.yaml
      commands:
      - cd /workspace/vllm
      - export VLLM_BATCH_INVARIANT=1
      - cd tests
      - pytest -v -s v1/determinism/test_xpu_batch_invariant_ut.py
      - bash ../.buildkite/scripts/hardware_ci/run-xpu-batch-invariance.sh
      plugins:
      - kubernetes: *k8s-2gpu
    - label: ":intel: (BMG) V1 Core + KV + Metrics"
      key: v1-core-kv-metrics-intel
      timeout_in_minutes: 45
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/
        - tests/v1/core
        - tests/v1/executor
        - tests/v1/kv_offload
        - tests/v1/worker
        - tests/v1/kv_connector/unit
        - tests/v1/ec_connector/unit
        - tests/v1/metrics
        - tests/entrypoints/openai/correctness/test_lmeval.py
      commands:
      - cd /workspace/vllm
      - pip install -r requirements/kv_connectors.txt
      - export VLLM_WORKER_MULTIPROC_METHOD=spawn
      - cd tests
      - pytest -v -s v1/executor
      - VLLM_BATCH_INVARIANT=1 pytest -v -s -m "not cpu_test" v1/ec_connector/unit --ignore=v1/ec_connector/unit/test_ec_cpu_connector.py
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) EC CPU Connector (XPU)"
      key: ec-cpu-connector-xpu
      timeout_in_minutes: 45
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/
        - tests/v1/core
        - tests/v1/executor
        - tests/v1/kv_offload
        - tests/v1/worker
        - tests/v1/kv_connector/unit
        - tests/v1/ec_connector/unit
        - tests/v1/metrics
        - tests/entrypoints/openai/correctness/test_lmeval.py
      commands:
      - cd /workspace/vllm
      - pip install -r requirements/kv_connectors.txt
      - export VLLM_WORKER_MULTIPROC_METHOD=spawn
      - cd tests
      - pytest -v -s v1/ec_connector/unit/test_ec_cpu_connector.py
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) V1 Sample + Logits"
      key: v1-sample-logits-intel
      timeout_in_minutes: 90
      agents:
        queue: intel-gpu-k8s
      env: *env
      parallelism: 4
      retry:
        automatic:
        - exit_status: 1
          limit: 1
      source_file_dependencies:
        - vllm/config/
        - vllm/distributed/
        - vllm/engine/
        - vllm/inputs/
        - vllm/logger.py
        - vllm/model_executor/
        - vllm/platforms/
        - vllm/sampling_params.py
        - vllm/transformers_utils/
        - vllm/utils/
        - vllm/v1/
        - tests/v1/sample
        - tests/v1/logits_processors
        - tests/v1/test_oracle.py
        - tests/v1/test_request.py
        - tests/v1/test_outputs.py
      commands:
      - cd /workspace/vllm
      - export PYTEST_ADDOPTS="--num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB"
      - export VLLM_WORKER_MULTIPROC_METHOD=spawn
      - cd tests
      - pytest -v -s v1/logits_processors --ignore=v1/logits_processors/test_custom_online.py --ignore=v1/logits_processors/test_custom_offline.py
      - pytest -v -s v1/test_oracle.py v1/test_request.py v1/test_outputs.py
      - pytest -v -s v1/sample
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) Basic Models Tests (Initialization)"
      key: basic-models-tests-initialization
      timeout_in_minutes: 60
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/
        - tests/models/test_initialization.py
        - tests/models/registry.py
      commands:
      - cd /workspace/vllm
      - export VLLM_XPU_FUSED_MOE_USE_REF=1
      - cd tests
      - pytest -v -s models/test_initialization.py::test_can_initialize_large_subset[Eagle3MiniMaxM2ForCausalLM]
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) CPU Offload"
      key: xpu-cpu-offload
      timeout_in_minutes: 60
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/
        - vllm/v1/kv_offload/
        - vllm/v1/kv_connector/
        - tests/v1/kv_offload/
        - tests/v1/kv_connector/unit/test_offloading_connector.py
      commands:
      - cd /workspace/vllm
      - export VLLM_WORKER_MULTIPROC_METHOD=spawn
      - cd tests
      - pytest -v -s v1/kv_offload
      - pytest -v -s v1/kv_connector/unit/test_offloading_connector.py
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) NixlConnector PD accuracy (4 GPUs)"
      key: nixlconnector-pd-accuracy-4-gpus
      timeout_in_minutes: 60
      agents:
        queue: intel-gpu-k8s
      env:
        <<: *env
        # TP>=4 hangs after xCCL init on the PCIe-only B70s without this.
        CCL_TOPO_FABRIC_VERTEX_CONNECTION_CHECK: "0"
      source_file_dependencies:
        - vllm/distributed/kv_transfer/kv_connector/
        - vllm/v1/worker/kv_connector_model_runner_mixin.py
        - tests/v1/kv_connector/nixl_integration/
        - vllm/platforms/xpu.py
      commands:
      - cd /workspace/vllm
      - cd tests
      - bash v1/kv_connector/nixl_integration/run_xpu_disagg_accuracy_test.sh
      - PREFILLER_TP_SIZE=2 DECODER_TP_SIZE=1 bash v1/kv_connector/nixl_integration/run_xpu_disagg_accuracy_test.sh
      - PREFILLER_TP_SIZE=1 DECODER_TP_SIZE=2 bash v1/kv_connector/nixl_integration/run_xpu_disagg_accuracy_test.sh
      - PREFILLER_TP_SIZE=2 DECODER_TP_SIZE=2 bash v1/kv_connector/nixl_integration/run_xpu_disagg_accuracy_test.sh
      plugins:
      - kubernetes: *k8s-4gpu
    - label: ":intel: (BMG) Regression"
      key: regression
      timeout_in_minutes: 50
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/config/
        - vllm/distributed/
        - vllm/engine/
        - vllm/inputs/
        - vllm/model_executor/
        - vllm/multimodal/
        - vllm/platforms/
        - vllm/sampling_params.py
        - vllm/transformers_utils/
        - vllm/utils/
        - vllm/v1/
        - tests/test_regression
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s test_regression.py
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) Metrics, Tracing (2 GPUs)"
      key: metrics-tracing-2-gpus
      timeout_in_minutes: 45
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/config/
        - vllm/distributed/
        - vllm/engine/
        - vllm/inputs/
        - vllm/model_executor/
        - vllm/multimodal/
        - vllm/platforms/
        - vllm/sampling_params.py
        - vllm/tracing/
        - vllm/transformers_utils/
        - vllm/utils/
        - vllm/v1/
        - tests/v1/tracing
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s v1/tracing
      plugins:
      - kubernetes: *k8s-2gpu
    - label: ":intel: (BMG) Async Engine, Inputs, Utils, Worker"
      key: async-engine-inputs-utils-worker
      timeout_in_minutes: 55
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/assets/
        - vllm/config/
        - vllm/distributed/
        - vllm/engine/
        - vllm/inputs/
        - vllm/model_executor/
        - vllm/multimodal/
        - vllm/platforms/
        - vllm/sampling_params.py
        - vllm/tokenizers/
        - vllm/transformers_utils/
        - vllm/utils/
        - vllm/v1/
        - tests/detokenizer
        - tests/multimodal
        - tests/utils_
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s detokenizer --ignore=detokenizer/test_stop_strings.py
      - pytest -v -s -m "not cpu_test" ./multimodal
      - pytest -v -s utils_ --ignore=utils_/test_mem_utils.py
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) Detokenizer Stop Strings (XPU)"
      key: detokenizer-stop-strings-xpu
      timeout_in_minutes: 45
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/assets/
        - vllm/config/
        - vllm/distributed/
        - vllm/engine/
        - vllm/inputs/
        - vllm/model_executor/
        - vllm/multimodal/
        - vllm/platforms/
        - vllm/sampling_params.py
        - vllm/tokenizers/
        - vllm/transformers_utils/
        - vllm/utils/
        - vllm/v1/
        - tests/detokenizer
        - tests/multimodal
        - tests/utils_
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s detokenizer/test_stop_strings.py
      plugins:
      - kubernetes: *k8s-1gpu
    - label: ":intel: (BMG) Fusion Unit Tests"
      key: fusion-unit-tests
      timeout_in_minutes: 30
      agents:
        queue: intel-gpu-k8s
      env: *env
      source_file_dependencies:
        - vllm/compilation/
        - tests/compile/passes/test_qk_norm_rope_fusion.py
      commands:
      - cd /workspace/vllm
      - cd tests
      - pytest -v -s compile/passes/test_qk_norm_rope_fusion.py
      plugins:
      - kubernetes: *k8s-1gpu

steps:
- group: Basic Correctness Intel
  steps:
  - label: ':intel: (BMG) Sleep Mode'
    key: xpu-sleep-mode
    agents:
      queue: intel-gpu-k8s
    commands:
    - cd /workspace/vllm
    - 'ci_otel_start() { :; }; ci_otel_finish() { :; }; ci_otel_run() { shift 2; env "$$@"; return $$?; }; CI_INFRA_OTEL_DIR="$${CI_INFRA_OTEL_DIR:-$$(git rev-parse --show-toplevel 2>/dev/null || printf %s "$${BUILDKITE_BUILD_CHECKOUT_PATH:-}")/.buildkite/scripts/ci-otel}"; export CI_INFRA_OTEL_DIR; if [ -f "$$CI_INFRA_OTEL_DIR/ci_otel.sh" ] && sh -n "$$CI_INFRA_OTEL_DIR/ci_otel.sh" && . "$$CI_INFRA_OTEL_DIR/ci_otel.sh"; then :; else echo "vLLM CI OTel: tracing setup skipped" >&2 || :; fi'
    - 'echo "+++ :test_tube: Command (1/4): cd tests"'
    - 'ci_otel_start 1 "cd tests" || :

      cd tests

      _CI_INFRA_OTEL_COMMAND_STATUS=$$?

      ci_otel_finish $$_CI_INFRA_OTEL_COMMAND_STATUS || :

      (exit $$_CI_INFRA_OTEL_COMMAND_STATUS)'
    - 'echo "+++ :test_tube: Command (2/4): export VLLM_WORKER_MULTIPROC_METHOD=spawn"'
    - 'ci_otel_start 2 "export VLLM_WORKER_MULTIPROC_METHOD=spawn" || :

      export VLLM_WORKER_MULTIPROC_METHOD=spawn

      _CI_INFRA_OTEL_COMMAND_STATUS=$$?

      ci_otel_finish $$_CI_INFRA_OTEL_COMMAND_STATUS || :

      (exit $$_CI_INFRA_OTEL_COMMAND_STATUS)'
    - 'echo "+++ :test_tube: Command (3/4): pytest -v -s basic_correctness/cpu_offload"'
    - ci_otel_run 3 "pytest -v -s basic_correctness/cpu_offload" pytest -v -s basic_correctness/cpu_offload
    - 'echo "+++ :test_tube: Command (4/4): pytest -v -s basic_correctness/memory"'
    - ci_otel_run 4 "pytest -v -s basic_correctness/memory" pytest -v -s basic_correctness/memory
    soft_fail: false
    retry:
      automatic:
      - exit_status: -1
        limit: 1
      - exit_status: 255
        limit: 1
    plugins:
    - kubernetes:
        checkout:
          skip: true
        podSpec:
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: b70-2
          initContainers:
          - name: copy-vllm-src
            image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:9da5f2d3103df460dfca53df4ab4884def5c935f-xpu
            command:
            - cp
            - -a
            - /workspace/vllm
            - /mnt/workspace/
            volumeMounts:
            - name: workspace
              mountPath: /mnt/workspace
          containers:
          - image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:9da5f2d3103df460dfca53df4ab4884def5c935f-xpu
            resources:
              claims:
              - name: gpu
              requests:
                cpu: '16'
                memory: 64Gi
              limits:
                cpu: '64'
                memory: 128Gi
            volumeMounts:
            - name: devshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            env:
            - name: VLLM_USAGE_SOURCE
              value: ci-test
            - name: PYTHONPATH
              value: ..
            - name: VLLM_DISABLE_COMPILE_CACHE
              value: '1'
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: BUILDKITE_ANALYTICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: buildkite-analytics-token-secret
                  key: token
                  optional: true
          volumes:
          - name: devshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: hf-cache
            hostPath:
              path: /var/lib/hf-cache
              type: DirectoryOrCreate
    env:
      VLLM_TEST_DEVICE: xpu
    timeout_in_minutes: 45
    priority: 0

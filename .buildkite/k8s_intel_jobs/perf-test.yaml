---
# vLLM Intel XPU multi-GPU load pipeline.
#
# Manually triggered (separate BK pipeline: vllm-intel-perf). Fans out
# across GPU counts: 1 / 2 / 4 / 8. Each step is a single Pod claiming
# that many Arc Pro B70s via DRA (ResourceClaimTemplate b70-<N>)
# and runs `vllm bench throughput` on Qwen3-1.7B (16 heads / 8 KV heads, so
# TP=1/2/4/8 all shard evenly; ~3.4 GiB of bf16 weights). It is deliberately
# small and short so a demo build finishes quickly while still keeping the
# GPUs busy enough that xpumd's hw_gpu_utilization_ratio visibly moves on the
# vLLM-CI Grafana dashboard. Prompt counts shrink as GPU count grows because
# TP4/TP8 are communication-bound: the B70s are PCIe-only (no XeLink), so
# every layer's all-reduce crosses PCIe. For longer/heavier load raise
# --num-prompts (or switch back to Qwen/Qwen3-8B, which fits one 32 GiB B70).
#
# Startup: weights are read from a node-local HF cache (hostPath
# /var/lib/hf-cache) so a run skips the model download; the first run on a
# node populates it. Steps 1/2/4 fit on the 8-GPU worker together (7 GPUs);
# the 8-GPU step waits for them to release theirs.
#
# Every step is admitted through Kueue (LocalQueue vllm-ci/ci-b70 ->
# ci-b70-cq) and stays SchedulingGated, with no GPU claim, until admitted.
# NOTE: ci-b70-cq is BestEffortFIFO, so smaller steps can still be admitted
# ahead of a waiting 8-GPU step when two builds overlap. Run builds one at a
# time, or switch the queue to StrictFIFO, if that matters.
#
# Image is the same pinned XPU build as pipeline.yaml.
.image: &image ghcr.io/sharvil10/vllm-xpu:12a974de181da1f39e54dca0d174e07f4f4d75a8-xpu

.resources: &resources
  requests:
    cpu: "2"
    memory: "8Gi"
  limits:
    cpu: "8"
    memory: "32Gi"

.env: &env
  - name: HF_HOME
    value: /hf-cache
  # Without this, xCCL's PCIe topology check stalls TP>=4 right after init
  # (workers spin at 100% CPU, no output). Verified on the 8x B70 worker.
  - name: CCL_TOPO_FABRIC_VERTEX_CONNECTION_CHECK
    value: "0"

.volumes: &volumes
  # Default /dev/shm in a k8s Pod is 64 MiB; vLLM's TP
  # shm_broadcast needs ~160 MiB. 1 GiB is comfy.
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 1Gi
  - name: hf-cache
    hostPath:
      path: /var/lib/hf-cache
      type: DirectoryOrCreate

.mounts: &mounts
  - name: dshm
    mountPath: /dev/shm
  - name: hf-cache
    mountPath: /hf-cache

steps:
  - label: ":video_game: 1-GPU: Qwen3-1.7B bench"
    key: gpu-1
    agents:
      queue: intel-b70
    commands:
      - |
        set -eu
        /opt/venv/bin/python3 -c "import torch; print('xpu count:', torch.xpu.device_count()); [print(f'  xpu:{i}: {torch.xpu.get_device_name(i)}') for i in range(torch.xpu.device_count())]"
        /opt/venv/bin/vllm bench throughput --model Qwen/Qwen3-1.7B \
          --input-len 1024 --output-len 256 --num-prompts 160 \
          --max-model-len 2048 --block-size 64 --enforce-eager
    plugins:
      - kubernetes:
          metadata:
            labels:
              kueue.x-k8s.io/queue-name: ci-b70
              kueue.x-k8s.io/priority-class: priority-normal
          podSpec:
            volumes: *volumes
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: b70-1
            containers:
              - image: *image
                env: *env
                resources:
                  <<: *resources
                  claims:
                    - name: gpu
                volumeMounts: *mounts

  - label: ":video_game::video_game: 2-GPU: Qwen3-1.7B bench --tp 2"
    key: gpu-2
    agents:
      queue: intel-b70
    commands:
      - |
        set -eu
        /opt/venv/bin/python3 -c "import torch; print('xpu count:', torch.xpu.device_count()); [print(f'  xpu:{i}: {torch.xpu.get_device_name(i)}') for i in range(torch.xpu.device_count())]"
        /opt/venv/bin/vllm bench throughput --model Qwen/Qwen3-1.7B \
          --input-len 1024 --output-len 256 --num-prompts 256 \
          --max-model-len 2048 --block-size 64 --enforce-eager \
          -tp 2 --distributed-executor-backend mp
    plugins:
      - kubernetes:
          metadata:
            labels:
              kueue.x-k8s.io/queue-name: ci-b70
              kueue.x-k8s.io/priority-class: priority-normal
          podSpec:
            volumes: *volumes
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: b70-2
            containers:
              - image: *image
                env: *env
                resources:
                  <<: *resources
                  claims:
                    - name: gpu
                volumeMounts: *mounts

  - label: ":video_game::video_game::video_game::video_game: 4-GPU: Qwen3-1.7B bench --tp 4"
    key: gpu-4
    agents:
      queue: intel-b70
    commands:
      - |
        set -eu
        /opt/venv/bin/python3 -c "import torch; print('xpu count:', torch.xpu.device_count()); [print(f'  xpu:{i}: {torch.xpu.get_device_name(i)}') for i in range(torch.xpu.device_count())]"
        /opt/venv/bin/vllm bench throughput --model Qwen/Qwen3-1.7B \
          --input-len 1024 --output-len 256 --num-prompts 64 \
          --max-model-len 2048 --block-size 64 --enforce-eager \
          -tp 4 --distributed-executor-backend mp
    plugins:
      - kubernetes:
          metadata:
            labels:
              kueue.x-k8s.io/queue-name: ci-b70
              kueue.x-k8s.io/priority-class: priority-normal
          podSpec:
            volumes: *volumes
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: b70-4
            containers:
              - image: *image
                env: *env
                resources:
                  <<: *resources
                  claims:
                    - name: gpu
                volumeMounts: *mounts

  - label: ":video_game: x8: all 8 GPUs: Qwen3-1.7B bench --tp 8"
    key: gpu-8
    agents:
      queue: intel-b70
    commands:
      - |
        set -eu
        /opt/venv/bin/python3 -c "import torch; print('xpu count:', torch.xpu.device_count()); [print(f'  xpu:{i}: {torch.xpu.get_device_name(i)}') for i in range(torch.xpu.device_count())]"
        /opt/venv/bin/vllm bench throughput --model Qwen/Qwen3-1.7B \
          --input-len 1024 --output-len 256 --num-prompts 32 \
          --max-model-len 2048 --block-size 64 --enforce-eager \
          -tp 8 --distributed-executor-backend mp
    plugins:
      - kubernetes:
          metadata:
            labels:
              kueue.x-k8s.io/queue-name: ci-b70
              kueue.x-k8s.io/priority-class: priority-normal
          podSpec:
            volumes: *volumes
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: b70-8
            containers:
              - image: *image
                env: *env
                resources:
                  <<: *resources
                  claims:
                    - name: gpu
                volumeMounts: *mounts
